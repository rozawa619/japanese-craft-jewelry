name: Verify and deploy Japanese Craft Jewelry
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - docs/deployment-results.json
      - docs/hosted-results.json
      - docs/handoff.md
      - docs/verification.md
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUBLIC_SITE_URL: https://rozawa619.github.io
      PUBLIC_BASE_PATH: /japanese-craft-jewelry/
      PUBLIC_PUBLISH_MODE: public
      PUBLIC_REPOSITORY_URL: https://github.com/rozawa619/japanese-craft-jewelry
      PUBLIC_OPERATOR_NAME: SORA
      PUBLIC_CONTACT_EMAIL: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-11-16
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: npm install -g pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - name: Check publication configuration
        run: pnpm readiness
      - run: pnpm verify
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
