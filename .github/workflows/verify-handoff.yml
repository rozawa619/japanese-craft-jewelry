name: Verify Git-only AI handoff
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUBLIC_SITE_URL: https://rozawa619.github.io
      PUBLIC_BASE_PATH: /japanese-craft-jewelry/
      PUBLIC_PUBLISH_MODE: public
      PUBLIC_REPOSITORY_URL: https://github.com/rozawa619/japanese-craft-jewelry
      PUBLIC_OPERATOR_NAME: SORA
      PUBLIC_CONTACT_EMAIL: ''
      NO_COLOR: '1'
      CHECK_IMAGE_REPORT_PATH: artifacts/checks/images.json
      CHECK_DETAIL_IMAGE_REPORT_PATH: artifacts/checks/detail-images.json
      CHECK_PRIVACY_REPORT_PATH: artifacts/checks/privacy.json
      SEO_REPORT_PATH: artifacts/checks/seo.json
      CHECK_JAPANESE_MODEL_REPORT_PATH: artifacts/checks/models.json
      CHECK_DOC_REPORT_PATH: artifacts/checks/docs.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          check-latest: true
      - name: Check Node security floor
        run: node scripts/check-runtime.mjs
      - name: Verify no creator-specific inputs exist
        run: node scripts/check-handoff-portability.mjs --preflight
      - name: Install the pinned package manager
        shell: bash
        run: |
          if ! npm install --prefix "$RUNNER_TEMP/handoff-pnpm" --no-save pnpm@11.25.0 > "$RUNNER_TEMP/handoff-pnpm.log" 2>&1; then
            cat "$RUNNER_TEMP/handoff-pnpm.log"
            BOOTSTRAP_LOG="$RUNNER_TEMP/handoff-pnpm.log" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const message=fs.readFileSync(process.env.BOOTSTRAP_LOG,'utf8').slice(-2500).replaceAll('%','%25').replaceAll('\r','%0D').replaceAll('\n','%0A');
          console.log('::error title=Pinned pnpm setup::'+message);
          NODE
            exit 1
          fi
          echo "$RUNNER_TEMP/handoff-pnpm/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Install dependencies from the frozen lockfile
        run: pnpm install --frozen-lockfile
      - name: Type, unit, build, links, image and privacy checks
        shell: bash
        run: |
          pnpm verify > artifacts/checks/verify.log 2>&1
          cat artifacts/checks/verify.log
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const log=fs.readFileSync('artifacts/checks/verify.log','utf8');
          const type=/Result \((\d+) files\)/.exec(log),tests=/\btests (\d+)/.exec(log);
          assert.ok(type&&tests);assert.match(log,/0 errors/);assert.match(log,/0 warnings/);assert.match(log,/0 hints/);assert.match(log,/\bfail 0/);
          const summary={typeFiles:Number(type[1]),unitTests:Number(tests[1]),errors:0,warnings:0,hints:0};
          console.log('::notice title=Git handoff static summary::'+JSON.stringify(summary));
          NODE
      - name: Check international search metadata
        run: pnpm check:seo
      - name: Check Japanese model records without private PNGs
        run: node --experimental-strip-types scripts/check-japanese-model-styling.mjs --dist
      - name: Check maintainer documentation
        run: pnpm check:docs
      - name: Compare every published output hash
        run: node scripts/check-handoff-portability.mjs --dist
